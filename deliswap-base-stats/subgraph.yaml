specVersion: 0.0.5
description: Subgraph tracking DeliSwap V2 and V4 pools, actions, TVL, and user positions.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PoolManager
    network: base
    source:
      address: "0x498581fF718922c3f8e6A244956aF099B2652b2b"
      abi: PoolManager
      startBlock: 25350988
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pool
        - Action
        - Token
        - TVLSnapshot
        - Position
        - User
      abis:
        - name: PoolManager
          file: ./abis/PoolManager.json
        - name: ERC20
          file: ./abis/ERC20.json
        - name: PositionManager
          file: ./abis/PositionManager.json
      eventHandlers:
        - event: Initialize(indexed bytes32,indexed address,indexed address,uint24,int24,address,uint160,int24)
          handler: handleInitialize
        - event: ModifyLiquidity(indexed bytes32,indexed address,int24,int24,int256,bytes32)
          handler: handleModifyLiquidity
        - event: Swap(indexed bytes32,indexed address,int128,int128,uint160,uint128,int24,uint24)
          handler: handleSwap
      file: ./src/poolManager.ts

  - kind: ethereum
    name: PositionManager
    network: base
    source:
      address: "0x7C5f5A4bBd8fD63184577525326123B519429bDc"
      abi: PositionManager
      startBlock: 25350993
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Position
        - User
      abis:
        - name: PositionManager
          file: ./abis/PositionManager.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
      file: ./src/positionManager.ts

  - kind: ethereum
    name: DeliHookConstantProduct
    network: base
    source:
      address: "0x10f5D70061072709E4C0F6B3f0fD64B38E12BACC"
      abi: DeliHookConstantProduct
      startBlock: 33808509
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pool
        - TVLSnapshot
        - Action
        - Position
      abis:
        - name: DeliHookConstantProduct
          file: ./abis/DeliHookConstantProduct.json
      eventHandlers:
        - event: Sync(indexed bytes32,uint128,uint128)
          handler: handleSync
        - event: Mint(indexed bytes32,indexed address,uint256,uint256)
          handler: handleV2Mint
        - event: Burn(indexed bytes32,indexed address,uint256,uint256,indexed address)
          handler: handleV2Burn
      file: ./src/v2hook.ts

  - kind: ethereum
    name: V2PositionHandler
    network: base
    source:
      address: "0x1735698eA06c9a5f910845187b7121c0207Ba75B"
      abi: V2PositionHandler
      startBlock: 33808509
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Position
        - User
        - Pool
      abis:
        - name: V2PositionHandler
          file: ./abis/V2PositionHandler.json
      eventHandlers:
        - event: V2PositionCreated(indexed bytes32,indexed address,uint256)
          handler: handleV2PositionCreated
        - event: V2PositionModified(indexed bytes32,indexed address,uint256,int256)
          handler: handleV2PositionModified
        - event: V2PositionRemoved(indexed bytes32,indexed address,uint256)
          handler: handleV2PositionRemoved
      file: ./src/v2positionHandler.ts
