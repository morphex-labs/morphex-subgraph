specVersion: 0.0.5
description: Subgraph tracking DeliSwap V2 and V4 pools, actions, TVL, and user positions.
schema:
  file: ./schema.graphql
dataSources:
  # 1. PoolManager (Uniswap V4 Core)
  # Tracks pool creation (Initialize), actions (Swap), and V4 liquidity changes (ModifyLiquidity).
  # Mappings filter events to only include DeliSwap pools based on the hook address.
  - kind: ethereum
    name: PoolManager
    network: base # ChainID 8453
    source:
      # PoolManager address on Base (from reference contracts)
      address: "0x498581fF718922c3f8e6A244956aF099B2652b2b"
      abi: PoolManager
      # Start block updated based on the deployment block of the PoolManager in reference contracts
      startBlock: 25350988
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pool
        - Action
        - Token
        - TVLSnapshot
        - Position
        - User
      abis:
        # ABIs must be provided in the ./abis directory
        - name: PoolManager
          file: ./abis/PoolManager.json
        - name: ERC20
          file: ./abis/ERC20.json
        # Added PositionManager ABI for contract calls (ownerOf) required in handleModifyLiquidity
        - name: PositionManager
          file: ./abis/PositionManager.json
      eventHandlers:
        # Pool Creation
        # Using the signature from the provided PoolManager.sol reference.
        - event: Initialize(bytes32 indexed id, address indexed currency0, address indexed currency1, uint24 fee, int24 tickSpacing, address hooks, uint160 sqrtPriceX96, int24 tick)
          handler: handleInitialize
        # V4 Liquidity Changes (Mints/Burns)
        # Used to track V4 positions and create MINT/BURN actions by identifying the user.
        # NOTE: Does not contain amount0/amount1.
        - event: ModifyLiquidity(bytes32 indexed id, address indexed sender, int24 tickLower, int24 tickUpper, int128 liquidityDelta, bytes32 salt)
          handler: handleModifyLiquidity
        # Swaps (V2 and V4)
        # Used to track SWAP actions and update V4 TVL.
        - event: Swap(bytes32 indexed id, address indexed sender, int128 amount0, int128 amount1, uint160 sqrtPriceX96, uint128 liquidity, int24 tick, uint24 fee)
          handler: handleSwap
      file: ./src/poolManager.ts

  # 2. PositionManager (Uniswap V4 Periphery)
  # Tracks V4 NFT ownership changes (User TVL).
  - kind: ethereum
    name: PositionManager
    network: base
    source:
      # PositionManager address on Base (from reference contracts)
      address: "0x7C5f5A4bBd8fD63184577525326123B519429bDc"
      abi: PositionManager
      # Start block updated based on the deployment block of the PositionManager in reference contracts
      startBlock: 25350993
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Position
        - User
      abis:
        - name: PositionManager
          file: ./abis/PositionManager.json
      eventHandlers:
        # Track NFT ownership changes (Transfers)
        - event: Transfer(indexed address from, indexed address to, indexed uint256 tokenId)
          handler: handleTransfer
      file: ./src/positionManager.ts
      # TODO: To accurately track V4 MINT/BURN amounts (amount0/amount1), which are missing from PoolManager.ModifyLiquidity,
      # one would need to decode the transaction input data of calls made to the PositionManager (e.g. mint, increaseLiquidity, decreaseLiquidity).
      # This is complex and currently omitted, resulting in placeholder amounts for V4 MINT/BURN actions.

  # 3. DeliHookConstantProduct (V2 Hook)
  # Tracks V2 specific events needed for accurate TVL and action details (amounts).
  - kind: ethereum
    name: DeliHookConstantProduct
    network: base
    source:
      address: "0x10f5D70061072709E4C0F6B3f0fD64B38E12BACC"
      abi: DeliHookConstantProduct
      startBlock: 33808509
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pool
        - TVLSnapshot
        - Action
        - Position
      abis:
        - name: DeliHookConstantProduct
          file: ./abis/DeliHookConstantProduct.json
      eventHandlers:
        # Update V2 reserves (TVL)
        - event: Sync(bytes32 indexed poolId, uint128 reserve0, uint128 reserve1)
          handler: handleSync
        # Capture V2 Mint details (amounts)
        - event: Mint(bytes32 indexed poolId, address indexed sender, uint256 amount0, uint256 amount1)
          handler: handleV2Mint
        # Capture V2 Burn details (amounts)
        - event: Burn(bytes32 indexed poolId, address indexed sender, uint256 amount0, uint256 amount1, address indexed to)
          handler: handleV2Burn
      file: ./src/v2hook.ts

  # 4. V2PositionHandler
  # Tracks V2 User Positions (Stakings/TVL per user) using synthetic TokenIds.
  - kind: ethereum
    name: V2PositionHandler
    network: base
    source:
      address: "0x1735698eA06c9a5f910845187b7121c0207Ba75B"
      abi: V2PositionHandler
      startBlock: 33808509
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Position
        - User
        - Pool
      abis:
        - name: V2PositionHandler
          file: ./abis/V2PositionHandler.json
      eventHandlers:
        - event: V2PositionCreated(bytes32 indexed poolId, address indexed owner, uint256 tokenId)
          handler: handleV2PositionCreated
        - event: V2PositionModified(bytes32 indexed poolId, address indexed owner, uint256 tokenId, int256 liquidityDelta)
          handler: handleV2PositionModified
        - event: V2PositionRemoved(bytes32 indexed poolId, address indexed owner, uint256 tokenId)
          handler: handleV2PositionRemoved
      file: ./src/v2positionHandler.ts
