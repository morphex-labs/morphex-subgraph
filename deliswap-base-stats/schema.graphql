type Token @entity {
    id: ID!
    symbol: String!
    name: String!
    decimals: Int!
    totalSupply: BigInt!
}

enum PoolType {
    V2
    V4
}

type Pool @entity {
    id: ID!
    type: PoolType!
    hookAddress: Bytes!
    token0: Token!
    token1: Token!
    fee: Int!
    tickSpacing: Int!
    createdAtTimestamp: BigInt!
    createdAtBlockNumber: BigInt!

    # V2: Total liquidity shares. V4: Active liquidity at current tick.
    liquidity: BigInt!
    # Total reserves (TVL)
    reserve0: BigInt!
    reserve1: BigInt!

    # V4 price/tick state
    sqrtPrice: BigInt
    tick: Int

    actions: [Action!]! @derivedFrom(field: "pool")
    snapshots: [TVLSnapshot!]! @derivedFrom(field: "pool")
    positions: [Position!]! @derivedFrom(field: "pool")
}

type User @entity {
    id: ID!
    positions: [Position!]! @derivedFrom(field: "user")
    actions: [Action!]! @derivedFrom(field: "user")
}

type Position @entity {
    id: ID!
    pool: Pool!
    user: User!
    liquidity: BigInt!

    # Underlying reserves (User TVL).
    # V4: Calculated using concentrated liquidity math based on current price, ticks, and liquidity.
    # V2: Calculated based on pro-rata share of pool reserves.
    reserve0: BigInt!
    reserve1: BigInt!

    # V4 range parameters
    tickLower: Int
    tickUpper: Int

    # NFT Token ID (V2/V4). Null for V4 non-NFT positions (direct PoolManager interaction).
    tokenId: BigInt
}

enum ActionType {
    SWAP
    MINT
    BURN
}

type Action @entity {
    id: ID!
    type: ActionType!
    timestamp: BigInt!
    blockNumber: BigInt!
    transactionHash: Bytes!
    pool: Pool!
    user: User!

    # For MINT/BURN: Absolute amount0/amount1 involved in the liquidity change.
    # For SWAP: signed amount0/amount1 delta for the pool.
    amount0: BigInt!
    amount1: BigInt!

    # SWAP specific fields
    tokenIn: Token
    tokenOut: Token
    amountIn: BigInt
    amountOut: BigInt
    isBuyToken0: Boolean
    isBuyToken1: Boolean
}

type TVLSnapshot @entity {
    id: ID!
    pool: Pool!
    timestamp: BigInt!
    blockNumber: BigInt!
    liquidity: BigInt!
    reserve0: BigInt!
    reserve1: BigInt!
}
